[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "coppermind"
version = "0.1.0"
description = "Copper: A personal AI agent that runs on self-hosted models."
readme = "README.md"
requies-python = ">=3.11"
dependencies = ["httpx"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
copper = "coppermind.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/coppermind"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]



